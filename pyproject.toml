[project]
name = "drink-heatmap-backend"
version = "0.1.0"
description = "Backend for Drink Heatmap Social Calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.1",
    "pydantic>=2.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
